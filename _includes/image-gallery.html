{% assign image_folder = "/assets/images/posts/" | append: include.folder %}
{% assign images = include.images | split: "," %}

<figure class="{{ include.layout }}" style="width: {{ include.width | default: '100%' }};">
  {% for image in images %}
    {% assign filename = image | strip %}
    {% assign image_url = image_folder | append: "/" | append: filename | relative_url %}
    <a href="{{ image_url }}">
      <img src="{{ image_url }}" alt="">
    </a>
  {% endfor %}
</figure>
